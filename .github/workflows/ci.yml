name: CI Pipeline - Password Generator

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: 🔍 Lint Code (ESLint)
    runs-on: ubuntu-latest
    # Le decimos a este trabajo que todos sus comandos "run" se ejecuten en esta carpeta
    defaults:
      run:
        working-directory: ./Examen_002/GENERADOR_CLAVES

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          # Importante: Le decimos dónde está el lock file para el caché
          cache-dependency-path: ./Examen_002/GENERADOR_CLAVES/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint
        continue-on-error: false

  format:
    name: ✨ Format Check (Prettier)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen_002/GENERADOR_CLAVES

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./Examen_002/GENERADOR_CLAVES/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check code formatting
        run: npm run format:check
        continue-on-error: false

  test:
    name: ✅ Run Tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./Examen_002/GENERADOR_CLAVES

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./Examen_002/GENERADOR_CLAVES/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          # Ajustamos la ruta para encontrar el reporte dentro de la subcarpeta
          files: ./Examen_002/GENERADOR_CLAVES/coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive coverage results
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          # Ajustamos la ruta para subir la carpeta correcta
          path: Examen_002/GENERADOR_CLAVES/coverage/
          retention-days: 30

  build:
    name: 📦 Build Project
    runs-on: ubuntu-latest
    needs: [lint, format, test]
    defaults:
      run:
        working-directory: ./Examen_002/GENERADOR_CLAVES

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: ./Examen_002/GENERADOR_CLAVES/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify project structure
        run: |
          echo "Verifying project can start..."
          # El timeout a veces falla en CI si el start no retorna,
          # asegúrate de que tu script start no se quede colgado eternamente o usa build
          timeout 10 npm start || echo "Project verified (timeout expected)"

      - name: Create build artifacts
        run: |
          mkdir -p build
          cp -r src package.json package-lock.json build/
          echo "Build completed successfully"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          # Ruta ajustada
          path: Examen_002/GENERADOR_CLAVES/build/
          retention-days: 30

      - name: Display build summary
        run: |
          echo "### Build Summary ✅" >> $GITHUB_STEP_SUMMARY
          echo "Build completed successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- Lint: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Format: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ✓" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ✓" >> $GITHUB_STEP_SUMMARY

  status-check:
    name: ✅ All Checks Passed
    runs-on: ubuntu-latest
    needs: [lint, format, test, build]
    if: always()

    steps:
      - name: Check job status
        run: |
          if [ "${{ needs.lint.result }}" != "success" ] || \
             [ "${{ needs.format.result }}" != "success" ] || \
             [ "${{ needs.test.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ]; then
            echo "❌ One or more jobs failed"
            exit 1
          fi
          echo "✅ All checks passed successfully!"